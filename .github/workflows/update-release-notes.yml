name: Update Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release existente
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-notes:
    name: Atualizar notas da release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código selecionado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Atualizar notas via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit --notes-file RELEASE_NOTES.md -- "$RELEASE_TAG"

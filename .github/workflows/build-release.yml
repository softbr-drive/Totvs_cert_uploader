name: Build and Release Windows Executable

on:
  push:
    branches:
      - codex/v1.4.0-teste
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar Executável Windows (PyInstaller)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: python test_suite.py

      - name: Compilar Executável com PyInstaller
        run: |
          pyinstaller --noconfirm --clean TOTVS-Cert-Uploader.spec

      - name: Armazenar executável
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: totvs-cert-uploader-windows
          path: dist/TOTVS-Cert-Uploader.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publicar release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Recuperar executável
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: totvs-cert-uploader-windows
          path: dist

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/TOTVS-Cert-Uploader.exe
          fail_on_unmatched_files: true
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
